<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled>

        <div class="buttons">

            <!-- Scientific Row -->
            <button class="btn" id="sin">sin</button>
            <button class="btn" id="cos">cos</button>
            <button class="btn" id="tan">tan</button>
            <button class="btn" id="sqrt">√</button>
            
            <button class="btn" id="log">log</button>
            <button class="btn" id="ln">ln</button>
            <button class="btn" id="pow">x^y</button>
            <button class="btn" id="fact">n!</button>

            <button class="btn" id="pi">π</button>
            <button class="btn" id="e">e</button>
            <button class="btn" id="left">(</button>
            <button class="btn" id="right">)</button>

            <!-- Normal Numbers -->
            <button class="btn" id="b7">7</button>
            <button class="btn" id="b8">8</button>
            <button class="btn" id="b9">9</button>
            <button class="btn" id="divide">/</button>

            <button class="btn" id="b4">4</button>
            <button class="btn" id="b5">5</button>
            <button class="btn" id="b6">6</button>
            <button class="btn" id="multiply">*</button>

            <button class="btn" id="b1">1</button>
            <button class="btn" id="b2">2</button>
            <button class="btn" id="b3">3</button>
            <button class="btn" id="minus">-</button>

            <button class="btn" id="b0">0</button>
            <button class="btn" id="dot">.</button>
            <button class="btn" id="plus">+</button>
            <button class="btn" id="equal">=</button>

            <!-- Clear Button -->
            <button class="btn clear" id="clear">C</button>

        </div>
    </div>
